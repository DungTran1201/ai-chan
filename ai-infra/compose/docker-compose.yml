version: "3.8"

services:
  # Secure Ingress Gateway with SSL Termination, Rate Limiting & DDOS Guards
  nginx-gateway:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ../docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - ai-frontend
      - ai-backend
    restart: unless-stopped

  ai-frontend:
    build:
      context: ../../ai-frontend
      dockerfile: ../ai-infra/docker/frontend.Dockerfile
    expose:
      - "3000"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api/v1
    depends_on:
      - ai-backend
    restart: unless-stopped

  ai-backend:
    build:
      context: ../../ai-backend
      dockerfile: ../ai-infra/docker/backend.Dockerfile
    expose:
      - "8000"
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ../../ai-backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_chan_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
