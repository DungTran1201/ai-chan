events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # =========================================================================
    # 1. TRAFFIC MANAGEMENT & DDOS DEFENSE
    # =========================================================================

    # Rate Limiting: 10 req/s for API, 30 req/s for General UI
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
    limit_req_status 429;

    # Connection Limiting: Max 20 concurrent connections per IP
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_conn_status 429;

    # Slowloris & Buffer Overflow Defense
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    client_max_body_size 10M;
    large_client_header_buffers 4 4k;

    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 10s;

    # =========================================================================
    # 2. UPSTREAM SERVICE POOLS
    # =========================================================================
    upstream frontend_upstream {
        server ai-frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server ai-backend:8000;
        keepalive 32;
    }

    # =========================================================================
    # 3. HTTP SERVER - PORT 80 (REDIRECT TO HTTPS)
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Redirect all HTTP requests to HTTPS
        return 301 https://$host$request_uri;
    }

    # =========================================================================
    # 4. HTTPS SECURE SERVER - PORT 443 (SSL/TLS & TRAFFIC GUARDS)
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost;

        # SSL Certificates
        ssl_certificate     /etc/nginx/certs/cert.crt;
        ssl_certificate_key /etc/nginx/certs/cert.key;

        # Modern TLS Security
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:;" always;

        # Connection Limit across entire virtual host
        limit_conn conn_limit 20;

        # =====================================================================
        # ROUTE: BACKEND API & LLM STREAMING
        # =====================================================================
        location /api/ {
            # API Rate Limiting: 10r/s with burst of 20, nodelay
            limit_req zone=api_limit burst=20 nodelay;

            # Bandwidth throttling for API responses: First 5MB full speed, then 2MB/s
            limit_rate_after 5m;
            limit_rate 2m;

            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";

            # Disable proxy buffering for Real-time Server-Sent Events (SSE) LLM streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # =====================================================================
        # ROUTE: FRONTEND WEB APPLICATION
        # =====================================================================
        location / {
            # UI Rate Limiting: 30r/s with burst of 50
            limit_req zone=general_limit burst=50;

            # Bandwidth throttling for web assets
            limit_rate_after 10m;
            limit_rate 5m;

            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }

        # Error pages for rate limiting & bad gateway
        error_page 429 /429.json;
        location = /429.json {
            default_type application/json;
            return 429 '{"error": "Too Many Requests", "message": "Rate limit or connection limit exceeded. Please throttle your requests."}';
        }
    }
}
